name: Generate Student Quick Start PDF

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ReportLab
        run: pip install reportlab

      - name: Generate PDF
        run: python docs/generate_pdf.py

      - name: Commit updated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Student_Quick_Start.pdf
          git diff --staged --quiet || git commit -m "docs: regenerate Student Quick Start PDF with Module 5 (HITL)"
          git push
